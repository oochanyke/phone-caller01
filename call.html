<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>電話をかける</title>
</head>
<body>
    <h2>電話アプリを開いています...</h2>
    <p>もし自動で開かない場合は、<a id="manualLink">こちらをタップ</a></p>
    <script>
        const queryParams = new URLSearchParams(window.location.search);
        const fragmentParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        const number = fragmentParams.get("number") || queryParams.get("number");

        if (window.history && typeof window.history.replaceState === 'function') {
            const sanitizedUrl = new URL(window.location.href);
            sanitizedUrl.searchParams.delete('number');
            const sanitizedFragment = new URLSearchParams(sanitizedUrl.hash.replace(/^#/, ''));
            sanitizedFragment.delete('number');
            sanitizedUrl.hash = sanitizedFragment.toString() ? '#' + sanitizedFragment.toString() : '';
            window.history.replaceState(window.history.state, document.title, sanitizedUrl.toString());
        }

        if (number) {
            document.getElementById("manualLink").href = "tel:" + number;
            window.location.href = "tel:" + number;
        }
    </script>
</body>
</html>
